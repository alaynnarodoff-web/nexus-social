spring.application.name=backend-api
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=nexusSocial
spring.data.mongodb.uri=mongodb://admin:password@localhost:27017/nexusSocial?authSource=admin
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.data.mongodb.username=api
spring.data.mongodb.password=nexus
spring.data.text.classifier.uri=http://localhost:8000/classify

