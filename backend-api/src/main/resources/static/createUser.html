<!DOCTYPE html>
<html>

<head>
    <title>Create User Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        .createUserForm {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 10px 0;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="center-container">
        <img src="thumbnail_IMG_2719.png" alt="My Image">
        <div class="createUserForm">
            <label for="usernameInput">Username:</label>
            <input type="text" id="usernameInput" name="username">
        </div>
        <div class="createUserForm">
            <label for="passwordInput">Password:</label>
            <input type="password" id="passwordInput" name="password">
        </div>
        <div class="createUserForm">
            <label for="emailInput">Email:</label>
            <input type="email" id="emailInput" name="email">
        </div>
        <div class="createUserForm">
            <label for="firstNameInput">First Name:</label>
            <input type="text" id="firstNameInput" name="firstName">
        </div>
        <div class="createUserForm">
            <label for="lastNameInput">Last Name:</label>
            <input type="text" id="lastNameInput" name="lastName">
        </div>
        <div class="createUserForm">
            <img src="" alt="avatar" id="avatarImage" style="">
            <input type="file" id="avatarInput" name="avatar" accept="image/*">
        </div>
        <button class="my-button" id="createUserButton">Create Account</button>
        <a href="index.html">Back to Login</a>
    </div>
    <script>
        let createUserButton = document.getElementById("createUserButton");
        createUserButton.addEventListener("click", function () {
            let username = document.getElementById("usernameInput").value;
            let password = document.getElementById("passwordInput").value;
            let email = document.getElementById("emailInput").value;
            let firstName = document.getElementById("firstNameInput").value;
            let lastName = document.getElementById("lastNameInput").value;
            let authorAvatar = document.getElementById("avatarImage").src;
            fetch('/user', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    email: email,
                    firstName: firstName,
                    lastName: lastName,
                    avatar: authorAvatar
                })
            }).then(function (response) {
                if (response.ok) {
                    alert('Account created successfully!');
                    window.location.href = "index.html";
                } else {
                    response.text().then(text => alert(text));
                }
            }).catch(function (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            });
        });
        const avatarInput = document.getElementById('avatarInput');
        avatarInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function (e) {
                const avatarBase64 = e.target.result;
                document.getElementById('avatarImage').src = avatarBase64;
            }
            reader.readAsDataURL(file);
        });
    </script>
</body>

</html>
