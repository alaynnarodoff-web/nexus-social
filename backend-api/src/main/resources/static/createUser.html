<!DOCTYPE html>

<html>

<head>
    <title>Create Account Page</title>
    <style>
        .my-button {
            background-color: orangered;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            position: absolute;
            top: 500px;
            left: 750px;
        }
    </style>
</head>


<body>
    <button class="my-button" id="createUserButton">Submit!</button>
    <img src="thumbnail_IMG_2719.png" alt="My Image"
        style="position: absolute; top: 750px; left: 700px; width: 200px; height: auto;">

    <label for="usernameInput" style="position: absolute; top: 300px; left: 650px;">Create Username:</label>
    <input type="text" id="usernameInput" name="username" style="position: absolute; top: 300px; left: 800px;">

    <label for="passwordInput" style="position: absolute; top: 350px; left: 650px;">Create Password:</label>
    <input type="password" id="passwordInput" name="password" style="position: absolute; top: 350px; left: 800px;">

    <label for="emailInput" style="position: absolute; top: 400px; left: 650px;">Email:</label>
    <input type="text" id="emailInput" name="email" style="position: absolute; top: 400px; left: 800px;">

    <label for="firstNameInput" style="position: absolute; top: 450px; left: 650px;">First Name:</label>
    <input type="text" id="firstNameInput" name="firstName" style="position: absolute; top: 450px; left: 800px;">

    <label for="lastNameInput" style="position: absolute; top: 500px; left: 650px;">Last Name:</label>
    <input type="text" id="lastNameInput" name="lastName" style="position: absolute; top: 500px; left: 800px;">

    <label for="phoneInput" style="position: absolute; top: 550px; left: 650px;">Phone Number:</label>
    <input type="text" id="phoneInput" name="phone" style="position: absolute; top: 550px; left: 800px;">

    <img src="" alt="avatar" id="avatarImage"
        style="position: absolute; top: 600px; left: 700px; width: 200px; height: auto;">
    <input type="file" id="avatarInput" name="avatar" accept="image/*"
        style="position: absolute; top: 700px; left: 700px;">
    <script>
        let createUserButton = document.getElementById("createUserButton");
        createUserButton.addEventListener("click", function () {
            let username = document.getElementById("usernameInput").value;
            let password = document.getElementById("passwordInput").value;
            fetch('/user', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: username, password: password })
            }).then(function (response) {
                if (response.ok) {
                    alert('Successfully created user!');
                } else {
                    throw new Error(`User creation failed: ${response.status}`);
                }
            }).catch(function (error) {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            });
        });
        const avatarInput = document.getElementById('avatarInput');
        avatarInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function (e) {
                const avatarBase64 = e.target.result;
                document.getElementById('avatarImage').src = avatarBase64;
            };
            reader.readAsDataURL(file);
        });

    </script>
</body>


</html>
