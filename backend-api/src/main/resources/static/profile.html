<!DOCTYPE html>
<html>

<head>
    <title>User Profile</title>
    <style>
        body {
            font-family: Cambria, serif;
            padding: 20px;
            text-align: center;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid orangered;
        }

        .post-card {
            margin: 10px auto;
            background: #fff3e6;
            border: 1px solid #ffd6b3;
            border-radius: 8px;
            width: 350px;
            padding: 15px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="profile-header">
        <img id="avatar" class="avatar" src="" alt="Avatar">
        <h2 id="username"></h2>
        <p id="bio"></p>
    </div>

    <h3>User Posts</h3>
    <div id="postsContainer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');

        if (!username) {
            document.body.innerHTML = "<p>No user specified.</p>";
        } else {
            // Fetch user info
            fetch(`/users/${username}`)
                .then(res => res.json())
                .then(user => {
                    document.getElementById("username").textContent = user.displayName || user.username;
                    document.getElementById("bio").textContent = user.bio || "";
                    document.getElementById("avatar").src = user.avatar || "defaultAvatar.jpg";
                })
                .catch(err => {
                    document.body.innerHTML = "<p>User not found.</p>";
                    console.error(err);
                });

            // Fetch user posts
            fetch(`/posts/user/${username}`)
                .then(res => res.json())
                .then(posts => {
                    const container = document.getElementById("postsContainer");

                    if (posts.length === 0) {
                        container.innerHTML = "<p>No posts found.</p>";
                        return;
                    }

                    posts.forEach(post => {
                        const div = document.createElement("div");
                        div.className = "post-card";
                        div.innerHTML = `
                            <p>${post.content}</p>
                            ${post.imageBase64 ? `<img src="data:image/jpeg;base64,${post.imageBase64}" style="max-width:100%"/>` : ""}
                            <small>${new Date(post.timestamp).toLocaleString()}</small>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(err => {
                    document.getElementById("postsContainer").innerHTML = "<p>Error loading posts.</p>";
                    console.error(err);
                });
        }
    </script>
</body>

</html>
