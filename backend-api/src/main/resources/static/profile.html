<!DOCTYPE html>
<html>

<head>
    <title>User Profile</title>
    <style>
        body {
            font-family: Cambria, serif;
            padding: 20px;
            text-align: center;
        }

        .profile-header {
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid orangered;
        }

        .post-card {
            margin: 10px auto;
            background: #fff3e6;
            border: 1px solid #ffd6b3;
            border-radius: 8px;
            width: 350px;
            padding: 15px;
            text-align: left;
        }

        .back-link {
            margin-top: 30px;
            color: orangered;
            text-decoration: none;
            font-size: 16px;
        }

        .my-button {
            background-color: orangered;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="profile-header">
        <img id="avatar" class="avatar" src="" alt="Avatar">
        <h2 id="username"></h2>
        <p id="bio"></p>
    </div>

    <h3 id="userPostsHeader">Loading posts...</h3>

    <button class="my-button" id="friendRequestButton">Send them a friend request!</button>

    <a class="back-link" href="viewPosts.html">Back to Main Posts</a>
    <div id="postsContainer"></div>


    <script>
        let friendRequestButton = document.getElementById("friendRequestButton");
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');


        friendRequestButton.addEventListener("click", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const recipientUsername = urlParams.get('username');

            fetch(`/friends/request?toUser=${recipientUsername}`, {
                method: "POST"
            })
                .then(res => {
                    if (!res.ok) throw new Error("Failed to send request");
                    return res.text();
                })
                .then(msg => {
                    friendRequestButton.textContent = "Friend Request Sent!";
                    friendRequestButton.disabled = true;
                    friendRequestButton.style.backgroundColor = "gray";
                    alert(msg);
                })
                .catch(err => {
                    alert("Error sending friend request.");
                    console.error(err);
                });
        });


        if (!username) {
            document.body.innerHTML = "<p>No user specified.</p>";
        } else {
            fetch(`/users/${username}`)
                .then(res => res.json())
                .then(user => {
                    document.getElementById("userPostsHeader").textContent = `${user.displayName || user.username}'s Posts`;
                    document.getElementById("username").textContent = user.displayName || user.username;
                    document.getElementById("bio").textContent = user.bio || "This user hasn't added a bio yet.";
                    if (user.avatar && user.avatar.trim() !== "") {
                        document.getElementById("avatar").src = user.avatar;
                    } else {
                        document.getElementById("avatar").src = "defaultAvatar.jpg";
                    }

                })
                .catch(err => {
                    document.body.innerHTML = "<p>User not found.</p>";
                    console.error(err);
                });
            fetch('/getUser')
                .then(res => res.json())
                .then(currentUser => {
                    if (!currentUser || !currentUser.username) return;

                    fetch(`/friends/areFriends?user1=${currentUser.username}&user2=${username}`)
                        .then(res => res.json())
                        .then(areFriends => {
                            if (areFriends) {
                                friendRequestButton.textContent = "Friends";
                                friendRequestButton.disabled = true;
                                friendRequestButton.style.backgroundColor = "gray";
                                friendRequestButton.style.cursor = "default";
                            }
                        });
                });


            fetch(`/posts/user/${username}`)
                .then(res => res.json())
                .then(posts => {
                    const container = document.getElementById("postsContainer");

                    if (posts.length === 0) {
                        container.innerHTML = "<p>No posts found.</p>";
                        return;
                    }

                    posts.forEach(post => {
                        const div = document.createElement("div");
                        div.className = "post-card";
                        div.innerHTML = `
                            <p>${post.content}</p>
                            ${post.imageBase64 ? `<img src="data:image/jpeg;base64,${post.imageBase64}" style="max-width:100%"/>` : ""}
                            <small>${new Date(post.timestamp).toLocaleString()}</small>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(err => {
                    document.getElementById("postsContainer").innerHTML = "<p>Error loading posts.</p>";
                    console.error(err);
                });
        }
    </script>
</body>

</html>
