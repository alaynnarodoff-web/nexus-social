<!DOCTYPE html>
<html>

<head>
    <title>View and Edit Account Page</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        .showingUser {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 10px 0;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="center-container">
        <div class="showingUser">
            <img src="defaultAvatar.jpg" alt="avatar" id="avatarImage" height="100" width="100"
                style="border-radius: 50%; margin-top: 10px; margin-left: 50px; border: 1px solid orangered;">
            <input type="file" id="avatarInput" name="avatar" accept="image/*">
        </div>
        <a href="friendsList.html" id="friendCountLink"
            style="color: orangered; text-decoration: none; font-size: 16px;">
            <span id="friendCount">Loading...</span>
        </a>


        <a class="back-link" href="friendRequests.html">View Your Friend Requests</a>


        <div class="showingUser">
            <label for="usernameInput">Username:</label>
            <input type="text" id="usernameInput" name="username">
        </div>

        <div class="showingUser">
            <label for="passwordInput">Password:</label>
            <input type="password" id="passwordInput" name="password">
        </div>

        <div class="showingUser">
            <label for="emailInput">Email:</label>
            <input type="text" id="emailInput" name="email">
        </div>

        <div class="showingUser">
            <label for="firstNameInput">First Name:</label>
            <input type="text" id="firstNameInput" name="firstName">
        </div>

        <div class="showingUser">
            <label for="lastNameInput">Last Name:</label>
            <input type="text" id="lastNameInput" name="lastName">
        </div>

        <div class="showingUser">
            <label for="phoneInput">Phone Number:</label>
            <input type="text" id="phoneInput" name="phone">
        </div>
        <div class="showingUser">
            <label for="bioInput">Bio:</label>
            <textarea id="bioInput" name="bio" rows="4" cols="50" placeholder="Write your bio..."></textarea>
        </div>



        <div class="showingUser">
            <a href="createPosts.html" style="color: orangered;">Create a Post</a>
        </div>

        <div class="showingUser">
            <a href="viewPosts.html" style="color: orangered;">View Posts</a>
        </div>
        <div class="showingUser">
            <a href="index.html" style="color: orangered;">Log Out</a>
        </div>

        <button class="my-button" id="updateUserButton">Update User!</button>
    </div>

    <script>
        async function getUser() {
            try {
                const response = await fetch('/getUser', { method: "GET" });
                const user = await response.json();

                document.getElementById("usernameInput").value = user.username || "";
                document.getElementById("passwordInput").value = user.password || "";
                document.getElementById("emailInput").value = user.email || "";
                document.getElementById("firstNameInput").value = user.firstName || "";
                document.getElementById("lastNameInput").value = user.lastName || "";
                document.getElementById("phoneInput").value = user.phone || "";
                document.getElementById("bioInput").value = user.bio || "";

                const avatarSrc = user.avatar && user.avatar !== "" ? user.avatar : "defaultAvatar.jpg";
                document.getElementById("avatarImage").src = avatarSrc;

            } catch (err) {
                console.error("Failed to fetch user data:", err);
                alert("Error loading user data.");
            }
            fetch("/friends/count")
                .then(res => {
                    if (!res.ok) throw new Error("Failed to get friend count");
                    return res.text();
                })
                .then(count => {
                    const num = parseInt(count, 10);
                    const label = num === 1 ? "friend" : "friends";
                    document.getElementById("friendCount").innerText = `${num} ${label}`;
                })
                .catch(err => {
                    console.error("Could not load friend count:", err);
                    document.getElementById("friendCount").innerText = "0 friends";
                });


        }


        document.getElementById("updateUserButton").addEventListener("click", function () {
            fetch('/getUser')
                .then(res => res.json())
                .then(currentUser => {
                    const updatedUser = {
                        username: currentUser.username,
                        email: document.getElementById("emailInput").value,
                        firstName: document.getElementById("firstNameInput").value,
                        lastName: document.getElementById("lastNameInput").value,
                        phone: document.getElementById("phoneInput").value,
                        avatar: document.getElementById("avatarInput").value,
                        bio: document.getElementById("bioInput").value
                    };

                    return fetch("/updateUser", {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(updatedUser)
                    });
                })
                .then(res => {
                    if (!res.ok) throw new Error("Failed to update user");
                    return res.text();
                })
                .then(msg => {
                    alert("Profile updated!");
                })
                .catch(err => {
                    console.error(err);
                    alert("Error updating profile: " + err.message);
                });
        });



        document.getElementById('avatarInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function (e) {
                const avatarBase64 = e.target.result;
                document.getElementById('avatarImage').src = avatarBase64;
            };
            if (file) {
                reader.readAsDataURL(file);
            }
        });

        window.onload = getUser;
    </script>

</body>

</html>
