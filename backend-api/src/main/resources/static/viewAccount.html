<!DOCTYPE html>
<html>

<head>
    <title>View and Edit Account Page</title>
    <style>
        .center-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .center-container img {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }

        .center-container a {
            color: orangered;
            margin-top: 20px;
            text-decoration: none;
            font-size: 16px;
        }

        .my-button {
            background-color: orangered;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .showingUser {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 10px 0;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="center-container">
        <!-- Avatar image - default shown if user.avatar is missing -->
        <div class="showingUser">
            <img src="defaultAvatar.jpg" alt="avatar" id="avatarImage" height="100" width="100"
                style="border-radius: 50%; margin-top: 10px; margin-left: 50px; border: 1px solid orangered;">
            <input type="file" id="avatarInput" name="avatar" accept="image/*">
        </div>

        <div class="showingUser">
            <label for="usernameInput">Username:</label>
            <input type="text" id="usernameInput" name="username">
        </div>

        <div class="showingUser">
            <label for="passwordInput">Password:</label>
            <input type="password" id="passwordInput" name="password">
        </div>

        <div class="showingUser">
            <label for="emailInput">Email:</label>
            <input type="text" id="emailInput" name="email">
        </div>

        <div class="showingUser">
            <label for="firstNameInput">First Name:</label>
            <input type="text" id="firstNameInput" name="firstName">
        </div>

        <div class="showingUser">
            <label for="lastNameInput">Last Name:</label>
            <input type="text" id="lastNameInput" name="lastName">
        </div>

        <div class="showingUser">
            <label for="phoneInput">Phone Number:</label>
            <input type="text" id="phoneInput" name="phone">
        </div>

        <div class="showingUser">
            <a href="createPosts.html" style="color: orangered;">Create a Post</a>
        </div>

        <div class="showingUser">
            <a href="viewPosts.html" style="color: orangered;">View Posts</a>
        </div>

        <button class="my-button" id="updateUserButton">Submit!</button>
    </div>

    <script>
        async function getUser() {
            try {
                const response = await fetch('/getUser', { method: "GET" });
                const user = await response.json();

                document.getElementById("usernameInput").value = user.username || "";
                document.getElementById("passwordInput").value = user.password || "";
                document.getElementById("emailInput").value = user.email || "";
                document.getElementById("firstNameInput").value = user.firstName || "";
                document.getElementById("lastNameInput").value = user.lastName || "";
                document.getElementById("phoneInput").value = user.phone || "";

                const avatarSrc = user.avatar && user.avatar !== "" ? user.avatar : "defaultAvatar.jpg";
                document.getElementById("avatarImage").src = avatarSrc;

            } catch (err) {
                console.error("Failed to fetch user data:", err);
                alert("Error loading user data.");
            }
        }

        document.getElementById("updateUserButton").addEventListener("click", function () {
            const username = document.getElementById("usernameInput").value;
            const password = document.getElementById("passwordInput").value;
            const email = document.getElementById("emailInput").value;
            const firstName = document.getElementById("firstNameInput").value;
            const lastName = document.getElementById("lastNameInput").value;
            const phone = document.getElementById("phoneInput").value;
            const avatar = document.getElementById("avatarImage").src;

            fetch('/user/' + username, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username, password, email, firstName, lastName, phone, avatar
                })
            }).then(response => {
                if (response.ok) {
                    alert('Successfully updated user!');
                } else {
                    throw new Error(`User update failed: ${response.status}`);
                }
            }).catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            });
        });

        // Preview selected image
        document.getElementById('avatarInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function (e) {
                const avatarBase64 = e.target.result;
                document.getElementById('avatarImage').src = avatarBase64;
            };
            if (file) {
                reader.readAsDataURL(file);
            }
        });

        // Load user on page load
        window.onload = getUser;
    </script>

</body>

</html>
