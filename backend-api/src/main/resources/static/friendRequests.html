<!DOCTYPE html>
<html>

<head>
    <title>Your Friend Requests</title>
    <style>
        body {
            font-family: Cambria, serif;
            padding: 20px;
            text-align: center;
        }

        .request-card {
            margin: 10px auto;
            background: #fff3e6;
            border: 1px solid #ffd6b3;
            border-radius: 8px;
            width: 350px;
            padding: 15px;
            text-align: left;
        }

        .my-button {
            background-color: orangered;
            color: white;
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>Your Friend Requests</h2>
    <div id="friendRequestsContainer"></div>

    <script>
        fetch("/friends/requests")
            .then(res => {
                if (!res.ok) throw new Error("Not logged in or server error");
                return res.json();
            })
            .then(requests => {
                const container = document.getElementById("friendRequestsContainer");
                if (requests.length === 0) {
                    container.innerHTML = "<p>No friend requests right now.</p>";
                    return;
                }

                requests.forEach(req => {
                    const div = document.createElement("div");
                    div.className = "request-card";
                    div.innerHTML = `
                        <p><strong>${req.requestingUserId}</strong> sent you a friend request.</p>
                        <button class="my-button" onclick="respond('${req.requestingUserId}', true)">Accept</button>
                        <button class="my-button" onclick="respond('${req.requestingUserId}', false)">Reject</button>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(err => {
                document.getElementById("friendRequestsContainer").innerHTML = "<p>Error loading requests.</p>";
                console.error(err);
            });

        function respond(fromUser, accept) {
            fetch(`/friends/respond?fromUser=${fromUser}&accept=${accept}`, {
                method: "POST"
            })
                .then(res => res.text())
                .then(msg => {
                    alert(msg);
                    location.reload();
                })
                .catch(err => {
                    alert("Error responding to request.");
                    console.error(err);
                });
        }
    </script>
</body>

</html>
